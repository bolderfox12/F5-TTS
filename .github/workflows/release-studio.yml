name: Publish F5 Studio release

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - CHANGELOG.md
      - docs/releases/**
      - .github/workflows/release-studio.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f5-studio-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine pre-commit
          pre-commit run --all-files
          python -m build
          python -m twine check dist/*
      - name: Check release version and packaged Studio components
        run: |
          python - <<'PY'
          import re
          import tomllib
          import zipfile
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), version
          assert Path(f'docs/releases/v{version}.md').is_file()
          wheel, = Path('dist').glob('*.whl')
          with zipfile.ZipFile(wheel) as archive:
              required = {'f5_tts/studio/app.py', 'f5_tts/studio/microphone.py',
                          'f5_tts/studio/microphone.js', 'f5_tts/studio/model_pages.py'}
              assert required <= set(archive.namelist())
              metadata = archive.read(f'f5_tts-{version}.dist-info/METADATA').decode()
              assert f'Version: {version}\n' in metadata
          PY
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; keeping its tag and assets."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "F5 Studio ${TAG}" \
              --notes-file "docs/releases/${TAG}.md" --latest dist/*.whl dist/*.tar.gz
          fi
